services:
  app:
    build: .
    command: >-
      sh -c 'if [ ! -f vendor/autoload.php ]; then composer install --no-interaction --prefer-dist || exit 1; fi;
      exec php artisan serve --host=0.0.0.0 --port=8000'
    ports:
      - "3000:8000"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 300s

  db:
    image: postgres:18-alpine
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata: